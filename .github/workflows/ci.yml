name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Backend lint ─────────────────────────────────────────────────────────────
  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend/app

      - name: Ruff format check
        run: ruff format --check backend/app

  # ── Frontend build & lint ────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  # ── Deploy (main branch only) ─────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL }}
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ── Build Lambda package ──────────────────────────────────────────────────
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Lambda zip
        run: |
          mkdir -p infra/dist/site-packages
          pip install -r backend/requirements.txt --target infra/dist/site-packages --quiet
          cp -r backend/app infra/dist/site-packages/app
          cd infra/dist/site-packages && zip -qr ../lambda.zip .
          echo "Lambda package size: $(du -sh ../lambda.zip | cut -f1)"

      # ── Terraform ─────────────────────────────────────────────────────────────
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve

      # ── Build and deploy frontend ─────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Sync frontend to S3
        run: |
          BUCKET=$(terraform -chdir=infra/terraform output -raw frontend_bucket)
          aws s3 sync frontend/dist/ s3://$BUCKET/ --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
